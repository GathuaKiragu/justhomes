plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin") // Flutter Gradle Plugin
    id("com.google.gms.google-services") // Google services plugin for Firebase
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "net.justapartments.app" // Ensures namespace is set
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // Version properties from pubspec.yaml
    def flutterVersionCode = project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
    def flutterVersionName = project.hasProperty('versionName') ? project.versionName : "1.0"
    
    defaultConfig {
        applicationId = "net.justapartments.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Change to release signing config when ready
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.10'
}
